name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.validate_release_tag.outputs.release_tag }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Naoku import regression
        run: npm run test:naoku-import

      - name: Package privacy regression
        run: npm run test:package-privacy

      - name: Release tag validation regression
        run: npm run test:release-tag

      - name: Syntax check
        shell: pwsh
        run: |
          $files = Get-ChildItem src, mcp, ui, scripts -Recurse -Include *.mjs, *.js
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "syntax error: $($f.FullName)" }
          }

      - name: Package and verify private-file exclusions (win32-x64 portable)
        run: npm run pack

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/exam-workbench-win32-x64 -DestinationPath dist/exam-workbench-win32-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: exam-workbench-win32-x64-${{ github.sha }}
          path: dist/exam-workbench-win32-x64.zip
          if-no-files-found: error

      - name: Check tag matches package.json version
        id: validate_release_tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release-tag.mjs

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: exam-workbench-win32-x64-${{ github.sha }}
          path: dist

      - name: Prepare release asset (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Validated release tag output is missing." }
          $asset = "dist/exam-workbench-$tag-win32-x64.zip"
          Copy-Item dist/exam-workbench-win32-x64.zip $asset

      - name: Publish release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $asset = "dist/exam-workbench-$tag-win32-x64.zip"
          gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes

      - name: Prepare main-latest asset (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $asset = "dist/exam-workbench-main-win32-x64.zip"
          Copy-Item dist/exam-workbench-win32-x64.zip $asset

      - name: Update main-latest pre-release (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist/exam-workbench-main-win32-x64.zip"
          gh release view main-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create main-latest --repo $env:GITHUB_REPOSITORY --prerelease --title "开发版（main 最新构建）" --notes "main 分支每次合并后自动构建；资产随最新提交覆盖更新。正式版本见 v* 标签的 Release。"
          }
          gh release upload main-latest $asset --repo $env:GITHUB_REPOSITORY --clobber
